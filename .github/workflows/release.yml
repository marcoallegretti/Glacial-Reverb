name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Produces a downloadable bundle so a tester needs to compile nothing:
#   * hardware  — gerbers (front + panel), BOM, kivu12 fab set, and PDF/SVG
#                 renders of both boards. Built from committed files only, so
#                 this job is reliable and was proven locally.
#   * vcv       — the VCV Rack plugin for Windows, macOS (Intel + Apple
#                 Silicon), and Linux, built with erbb. Each runner builds its
#                 own architecture natively, so there is no cross-compilation:
#                   * windows-2022    -> win-x64
#                   * macos-15-intel  -> mac-x64   (Apple dropped macos-13)
#                   * macos-15        -> mac-arm64
#                   * ubuntu-latest   -> lin-x64
#                 The ohmtech vcv-rack-sdk submodule ships a prebuilt libRack
#                 for every one of these OS/CPU pairs, so the same erbb recipe
#                 works everywhere. The erbb recipe mirrors eurorack-blocks' own
#                 CI. If a vcv job fails, the release still ships the hardware
#                 bundle (fail-fast is off, so one platform dropping out does
#                 not sink the others).
#
# erbb build simulator / firmware never touch the hardware files, so the
# committed front PCB stays byte-identical; the broken `erbb build hardware`
# (KiCad-6 parser vs the KiCad-10 board) is never invoked.

permissions:
  contents: write

jobs:
  hardware:
    name: Hardware bundle + board renders
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:nightly
      options: --user root   # the image runs as uid 1000; checkout needs write access to /__w
    steps:
      - uses: actions/checkout@v4
      - name: Render both boards to PDF and SVG
        run: |
          mkdir -p out/hardware/render
          H=eurorack/artifacts/hardware
          for board in GlacialReverb GlacialReverb.panel; do
            kicad-cli pcb export pdf \
              --layers F.Cu,B.Cu,F.Silkscreen,B.Silkscreen,Edge.Cuts \
              -o "out/hardware/render/${board}.pdf" "$H/${board}.kicad_pcb"
            kicad-cli pcb export svg --page-size-mode 2 \
              --layers F.Cu,B.Cu,F.Silkscreen,B.Silkscreen,Edge.Cuts \
              -o "out/hardware/render/${board}.svg" "$H/${board}.kicad_pcb"
          done
      - name: Gather fab deliverables
        run: |
          H=eurorack/artifacts/hardware
          cp "$H/GlacialReverb.gerber.zip"        out/hardware/
          cp "$H/GlacialReverb.panel.gerber.zip"  out/hardware/
          cp "$H/GlacialReverb.bom.csv"           out/hardware/
          cp -r "$H/kivu12"                       out/hardware/kivu12
          cp BUILD.md THIRD-PARTY.md              out/hardware/
      - uses: actions/upload-artifact@v4
        with:
          name: hardware
          path: out/hardware

  vcv:
    name: VCV plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: GlacialReverb-vcv-win-x64
          - os: macos-15-intel
            asset: GlacialReverb-vcv-mac-x64
          - os: macos-15
            asset: GlacialReverb-vcv-mac-arm64
          - os: ubuntu-latest
            asset: GlacialReverb-vcv-lin-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout eurorack-blocks
        uses: actions/checkout@v4
        with:
          repository: ohmtech-rdi/eurorack-blocks
          submodules: recursive
          path: erb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install VCV Rack (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask vcv-rack
      # libRack.so (lin-x64) records libGL/libGLU as NEEDED, so the plugin link
      # step needs the Mesa dev libs on PATH. Plain `erbb setup` skips apt unless
      # --with-apt is passed, and we don't want the heavy KiCad/ARM toolchain it
      # would pull in, so install just these two here.
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libgl1-mesa-dev
      # install.py writes erbb's location into the login profile. It must be its
      # OWN step: erbb only lands on PATH when the next `bash -l` re-sources the
      # profile, so anything in the same run-block still sees "command not found".
      # This mirrors eurorack-blocks' own CI, which keeps them separate.
      - name: Install erbb toolchain
        run: python3 erb/build-system/install.py
      - name: erbb setup
        run: erbb setup
      - name: Link the framework into the project
        run: |
          mkdir -p project/dep
          ln -s "$GITHUB_WORKSPACE/erb" project/dep/eurorack-blocks
      - name: Build the simulator plugin
        working-directory: project/eurorack
        run: |
          erbb configure
          erbb build simulator --configuration release
      - name: Collect the plugin
        run: |
          mkdir -p out
          cp -r project/eurorack/artifacts/simulator/*/package/* out/ 2>/dev/null || \
          cp -r project/eurorack/artifacts/simulator out/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out

  release:
    name: Publish release
    # Wait for the vcv matrix too, or Publish races ahead and attaches only the
    # hardware bundle. always() lets it run even when a vcv job fails; the
    # hardware.result gate keeps hardware genuinely required. Whatever artifacts
    # exist at download time get attached, so a failed platform just drops out.
    needs: [hardware, vcv]
    if: ${{ always() && needs.hardware.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Zip each artifact
        run: |
          mkdir -p rel
          for d in dl/*/; do
            name=$(basename "$d")
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/rel/${name}.zip" .)
          done
          ls -la rel
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: GlacialReverb ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: rel/*.zip
